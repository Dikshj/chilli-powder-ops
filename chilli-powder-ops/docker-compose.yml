services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chilli_ops
      POSTGRES_USER: chilli
      POSTGRES_PASSWORD: chilli
    ports: ["5433:5432"]
    volumes:
      - chilli_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chilli -d chilli_ops"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://chilli:chilli@db:5432/chilli_ops
      CHILLI_API_KEY: ${CHILLI_API_KEY:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  chilli_pgdata:

